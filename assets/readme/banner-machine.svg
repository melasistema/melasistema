<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Luca Visciola, Full Stack Developer and Technology Consultant, founder of Letterhead Studio. Machine mode.">
  <defs>
    <style>
      .mono { font-family: "Source Code Pro", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 22px; fill: #e8e8e8; }
      .prompt { fill: #ef762e; }
      .cmd { fill: #c9a700; }
      .key { fill: #c586c0; }
      .str { fill: #6a9955; }
      .comment { fill: #8a8a8a; font-size: 15px; }
      .cursor { fill: #e8e8e8; animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1280" height="400" fill="#000"/>
  <rect x="50" y="40" width="1180" height="320" fill="#1e1e1e"/>

  <!-- window chrome -->
  <circle cx="84" cy="70" r="7" fill="#ff5f57"/>
  <circle cx="108" cy="70" r="7" fill="#febc2e"/>
  <circle cx="132" cy="70" r="7" fill="#28c840"/>

  <text class="mono" x="90" y="112"><tspan class="prompt">$ </tspan><tspan class="cmd">curl</tspan> -s resume.lucavisciola.com/resume.json | <tspan class="cmd">jq</tspan> '.basics | {name, label}'</text>
  <text class="mono" x="90" y="144">{</text>
  <text class="mono" x="117" y="174"><tspan class="key">"name"</tspan>: <tspan class="str">"Luca Visciola"</tspan>,</text>
  <text class="mono" x="117" y="204"><tspan class="key">"label"</tspan>: <tspan class="str">"Full Stack Developer &amp; Technology Consultant"</tspan></text>
  <text class="mono" x="90" y="234">}</text>
  <text class="mono" x="90" y="272"><tspan class="prompt">$ </tspan><tspan class="cmd">curl</tspan> -s resume.lucavisciola.com/resume.json | <tspan class="cmd">jq</tspan> -r '.work[0].name'</text>
  <text class="mono" x="90" y="304">Letterhead Studio</text>
  <text class="mono" x="90" y="338"><tspan class="prompt">$ </tspan></text>
  <rect class="cursor" x="118" y="320" width="13" height="24"/>

  <text class="mono comment" x="700" y="338">// machine mode · a light theme shows the other half</text>
</svg>
