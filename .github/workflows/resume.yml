# Validates resume.json and its Italian twin against the JSON Resume schema,
# and checks that the PDFs rendered by scripts/pdf.sh are not older than their JSON.
# The workflow name is the badge label in the README: "resume.json | passing".
name: resume.json

on:
  push:
    branches: [main]
    paths: [resume.json, resume.it.json, resume.pdf, resume.it.pdf, .github/workflows/resume.yml]
  pull_request:
    paths: [resume.json, resume.it.json, resume.pdf, resume.it.pdf, .github/workflows/resume.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the PDF check compares commit dates

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate against JSON Resume schema v1.0.0
        run: |
          npm install --no-save --silent resume-schema@1.0.0
          node -e '
            const schema = require("resume-schema");
            for (const file of ["resume.json", "resume.it.json"]) {
              schema.validate(require(`./${file}`), (errors) => {
                if (errors) {
                  console.error(file, JSON.stringify(errors, null, 2));
                  process.exit(1);
                }
                console.log(`${file} is a valid JSON Resume.`);
              });
            }
          '

      - name: PDFs are not older than their JSON
        run: |
          stale=0
          for pair in resume.json:resume.pdf resume.it.json:resume.it.pdf; do
            json=${pair%%:*} pdf=${pair##*:}
            json_at=$(git log -1 --format=%ct -- "$json")
            pdf_at=$(git log -1 --format=%ct -- "$pdf")
            if [ "${json_at:-0}" -gt "${pdf_at:-0}" ]; then
              echo "::error file=$pdf::$pdf is older than $json: run scripts/pdf.sh and commit it"
              stale=1
            fi
          done
          exit $stale
